name: Refresh and publish Sultans softball calendar

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scrape_schedule.py"
      - "requirements.txt"
      - ".github/workflows/refresh-calendar.yml"
  schedule:
    # Daily at 6:23 AM Eastern. A non-zero minute avoids the busiest top-of-hour window.
    - cron: '23 6 * * *'
      timezone: "America/New_York"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "sultans-softball-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Scrape schedule and build calendar
        env:
          SOURCE_URL: "https://vaarlingtonweb.myvscloud.com/webtrac/web/schedule.html?action=leaguedetails&awayid=304539538&fmid=345063462"
          TEAM_NAME: "Sultans"
          LEAGUE_ID: "345063462"
          TIMEZONE: "America/New_York"
          MIN_NIGHTS: "3"
          GAME_DURATION_MINUTES: "55"
          DOUBLEHEADER_GAP_MINUTES: "60"
        run: python scrape_schedule.py

      - name: Upload scraper diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scraper-diagnostics
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep an audit copy in the repository
        run: |
          mkdir -p published
          cp site/sultans-softball.ics published/sultans-softball.ics
          cp debug/parsed-nights.json published/last-parsed-nights.json
          cp debug/parsed-games.json published/last-parsed-games.json
          date -u +'%Y-%m-%dT%H:%M:%SZ' > published/last-successful-refresh.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Sultans softball calendar"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
